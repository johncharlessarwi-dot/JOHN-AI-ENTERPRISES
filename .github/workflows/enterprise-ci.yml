name: Enterprise Build and Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: enterprise-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- ':(glob,icase)**/.env*' | while IFS= read -r -d '' path; do
            if [[ "$path" != .env.example ]]; then
              echo 'Unexpected tracked environment file. Review the Git index privately.' >&2
              exit 1
            fi
          done
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
